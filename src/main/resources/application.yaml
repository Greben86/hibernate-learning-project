server:
  port: 8080

spring:
  application:
    name: LearningApp
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/exam_db}"
    username: "${DB_USERNAME:admin}"
    password: "${DB_PASSWORD:admin}"
    driverClassName: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  mail:
    host: "${SMTP_HOST:}"
    port: "${SMTP_PORT:}"
    username: "${EMAIL_USERNAME:}"
    password: "${EMAIL_PASSWORD:}"
    test-connection: false
    properties:
      health:
        mail:
          enabled: false
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

security:
  token:
    signing:
      key: 53A73E5F1C4E0A2D3B5F2D784E6A1B423D6F247D1F6E5C3A596D635A75327855
    expiration:
      milliseconds: 144000000
