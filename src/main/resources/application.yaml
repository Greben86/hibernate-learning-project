server:
  port: 8080

spring:
  application:
    name: LearningApp
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/exam_db}"
    username: "${DB_USERNAME:admin}"
    password: "${DB_PASSWORD:admin}"
    driverClassName: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
